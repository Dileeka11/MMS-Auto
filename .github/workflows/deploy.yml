name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: /api
        run: npm run build

      - name: Deploy frontend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./frontend/dist/
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            api/**
            laravel/**
            .well-known/**
            cgi-bin/**
            extract.php
            laravel.zip

  deploy-backend:
    name: Build & Deploy Backend (Laravel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring, bcmath, pdo, pdo_mysql, tokenizer, xml, ctype, json, fileinfo, openssl, zip
          tools: composer:2.6.6

      - name: Install composer dependencies (fresh resolve for PHP 7.4 + stable)
        working-directory: backend
        run: |
          rm -f composer.lock
          composer update --no-dev --optimize-autoloader --prefer-dist --prefer-stable --no-interaction --no-audit

      - name: Create production .env
        working-directory: backend
        env:
          ENV_CONTENT: ${{ secrets.PROD_ENV_FILE }}
        run: printf '%s' "$ENV_CONTENT" > .env

      - name: Clear any cached config (paths would be wrong on server)
        working-directory: backend
        run: |
          php artisan config:clear || true
          php artisan route:clear || true
          php artisan view:clear || true
          rm -f bootstrap/cache/config.php bootstrap/cache/routes-v7.php bootstrap/cache/packages.php bootstrap/cache/services.php

      - name: Prepare Laravel app folder (without public/)
        run: |
          mkdir -p deploy/laravel
          rsync -a --exclude='public' --exclude='node_modules' --exclude='tests' --exclude='.git' --exclude='.env.example' backend/ deploy/laravel/

      - name: Zip Laravel app
        run: |
          cd deploy
          zip -rq laravel.zip laravel
          ls -lh laravel.zip

      - name: Prepare Laravel public folder
        run: |
          mkdir -p deploy/api
          cp -r backend/public/. deploy/api/
          sed -i "s|__DIR__.'/../storage|__DIR__.'/../laravel/storage|g" deploy/api/index.php
          sed -i "s|__DIR__.'/../vendor|__DIR__.'/../laravel/vendor|g" deploy/api/index.php
          sed -i "s|__DIR__.'/../bootstrap|__DIR__.'/../laravel/bootstrap|g" deploy/api/index.php

      - name: Create extractor PHP script
        env:
          EXTRACT_TOKEN: ${{ secrets.EXTRACT_TOKEN }}
        run: |
          mkdir -p deploy/root
          cp deploy/laravel.zip deploy/root/laravel.zip
          cat > deploy/root/extract.php <<'PHPEOF'
          <?php
          // One-time extractor — deletes itself after use
          $token = $_GET['token'] ?? '';
          $expected = getenv('EXTRACT_TOKEN_ENV') ?: 'REPLACE_TOKEN';
          if ($token !== $expected) {
              http_response_code(403);
              die('Forbidden');
          }
          $zipPath = __DIR__ . '/laravel.zip';
          if (!file_exists($zipPath)) {
              die('laravel.zip not found');
          }
          $target = __DIR__ . '/';
          // Delete existing /laravel folder
          $laravelDir = __DIR__ . '/laravel';
          if (is_dir($laravelDir)) {
              $it = new RecursiveDirectoryIterator($laravelDir, RecursiveDirectoryIterator::SKIP_DOTS);
              $files = new RecursiveIteratorIterator($it, RecursiveIteratorIterator::CHILD_FIRST);
              foreach ($files as $f) {
                  $f->isDir() ? rmdir($f->getPathname()) : unlink($f->getPathname());
              }
              rmdir($laravelDir);
          }
          $zip = new ZipArchive();
          if ($zip->open($zipPath) === TRUE) {
              $zip->extractTo($target);
              $zip->close();
              unlink($zipPath);
              @unlink(__FILE__);
              echo "OK: extracted " . date('c');
          } else {
              die('Failed to open zip');
          }
          PHPEOF
          sed -i "s|REPLACE_TOKEN|$EXTRACT_TOKEN|g" deploy/root/extract.php

      - name: Deploy zip + extractor to root via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/root/
          server-dir: /
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            assets/**
            api/**
            laravel/**
            cgi-bin/**
            .well-known/**
            index.html
            .htaccess

      - name: Trigger server-side extraction
        env:
          EXTRACT_TOKEN: ${{ secrets.EXTRACT_TOKEN }}
        run: |
          echo "Triggering extraction..."
          sleep 5
          response=$(curl -sS -w "\n%{http_code}" "https://nms-auto.sourcecode.lk/extract.php?token=${EXTRACT_TOKEN}")
          echo "$response"
          code=$(echo "$response" | tail -n1)
          if [ "$code" != "200" ]; then
            echo "Extraction failed with HTTP $code"
            exit 1
          fi

      - name: Deploy Laravel public (/api) via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/api/
          server-dir: /api/
